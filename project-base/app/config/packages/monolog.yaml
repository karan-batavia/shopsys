parameters:
    shopsys.monolog.formatter: "monolog.formatter.line"
    shopsys.monolog.main_log_level: "info"
    shopsys.monolog.cron_log_level: "info"

when@prod:
    parameters:
        shopsys.monolog.main_log_level: "warning"
        shopsys.monolog.formatter: "monolog.formatter.line"

when@test:
    parameters:
        shopsys.monolog.main_log_level: "notice"

monolog:
    channels: ["cron", "queue", "slow", "deprecation"]
    handlers:
        deprecated:
            type: "null"
            channels: ["deprecation"]
        # display cron.DEBUG messages in console for -v, -vv and -vvv verbosities
        console_output:
            type: console
            process_psr_3_messages: false
            verbosity_levels:
                VERBOSITY_NORMAL: INFO
                VERBOSITY_VERBOSE: DEBUG
                VERBOSITY_VERY_VERBOSE: DEBUG
                VERBOSITY_DEBUG: DEBUG
            channels: [ cron, queue ]
        # Register the breadcrumb handler as a Monolog handler
        sentry_breadcrumbs:
            type: service
            name: sentry_breadcrumbs
            id: Sentry\Monolog\BreadcrumbHandler
        # Register the handler as a Monolog handler to capture messages as events
        sentry:
            type: sentry
            level: !php/const Monolog\Logger::ERROR # Configures the level of messages to capture as events
            hub_id: Sentry\State\HubInterface
            fill_extra_context: true # Enables sending monolog context to Sentry
            process_psr_3_messages: false
        cron_output:
            type: stream
            path: "%shopsys.log_stream%"
            level: "%shopsys.monolog.cron_log_level%"
            formatter: "%shopsys.monolog.formatter%"
            channels: [ cron, queue ]
            # stop propagation to the second "console" handler so that message is not printed twice
            bubble: false
        main:
            type: stream
            path: "%shopsys.log_stream%"
            level: "%shopsys.monolog.main_log_level%"
            formatter: "%shopsys.monolog.formatter%"
